name: Test downstream projects

# Called from tests.yml once the fast test jobs have passed, so we don't spend
# runner time on downstream projects when traitlets itself is broken.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  ipython:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
      - uses: jupyterlab/maintainer-tools/.github/actions/downstream-test@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
        with:
          package_name: ipython
          package_spec: -e .[test]

  nbconvert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
      - uses: jupyterlab/maintainer-tools/.github/actions/downstream-test@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
        with:
          package_name: nbconvert
          package_spec: -e .[test]

  jupyter_server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
      - uses: jupyterlab/maintainer-tools/.github/actions/downstream-test@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
        with:
          package_name: jupyter_server

  ipywidgets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
      - uses: jupyterlab/maintainer-tools/.github/actions/downstream-test@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
        with:
          package_name: ipywidgets

  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
      - uses: jupyterlab/maintainer-tools/.github/actions/downstream-test@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
        with:
          package_name: notebook
          test_command: pytest -vv --ignore-glob=notebook/tests/selenium/* --ignore-glob=notebook/nbconvert/tests/* --ignore-glob=notebook/services/nbconvert/tests/*
